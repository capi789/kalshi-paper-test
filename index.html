<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Strategy Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--panel:#131a2c;--panel2:#18203a;--row:#141b2e;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--text:#e6ecff;--muted:#9aa4c0;--dim:#8490ad;--green:#22c55e;--red:#f87171;--cyan:#22d3ee;--blue:#3b82f6;
--grad:linear-gradient(135deg,#22d3ee 0%,#22c55e 100%);--ease:cubic-bezier(.2,.8,.2,1);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font-family:inherit}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
.glow{position:absolute;border-radius:50%;filter:blur(100px);opacity:.22;animation:drift 24s ease-in-out infinite alternate}
.glow.a{width:560px;height:560px;background:#0e7490;top:-200px;left:-160px}
.glow.b{width:520px;height:520px;background:#15803d;bottom:-220px;right:-160px;animation-delay:-9s}
@keyframes drift{to{transform:translate(70px,50px) scale(1.12)}}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,15,26,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hw{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;white-space:nowrap;margin-right:auto}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:9px 14px;border-radius:10px;cursor:pointer;position:relative;transition:color .2s,background .2s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.on{color:var(--text)}
.tab.on:after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;background:var(--grad)}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px;transition:border-color .2s}
.ddbtn:hover{border-color:rgba(34,211,238,.45)}
.ddbtn .num{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:700 12px/1 var(--mono);color:#0b0f1a}
.ddbtn .chev{transition:transform .25s var(--ease)}
.dd.open .chev{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-height:70vh;overflow-y:auto;background:#121828;border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.55);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s,transform .18s var(--ease)}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.mgroup{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:10px 10px 6px}
.mi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);text-align:left;padding:10px;border-radius:10px;cursor:pointer}
.mi:hover,.mi.on{background:rgba(255,255,255,.05)}
.mi .num{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 13px/1 var(--mono);color:#0b0f1a;flex:none}
.mi .nm{font-weight:600;font-size:14px;line-height:1.2}
.mi .by{font-size:12px;color:var(--muted)}
.mi .rs{margin-left:auto;text-align:right;font:600 13px/1.3 var(--mono);white-space:nowrap}
.mi .rs small{display:block;font-weight:500;font-size:11px}

main{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* top cards */
.top{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px}
.prof .head{display:flex;gap:16px;align-items:center;padding:20px 22px}
.av{width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 28px/1 var(--mono);color:#0b0f1a}
.prof h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.prof .meta{color:var(--muted);font-size:15px;margin-top:4px}
.prof .how{padding:0 22px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 22px}
.trio div{text-align:center;padding:16px 4px}
.trio b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.trio span{color:var(--muted);font-size:14px}
.lines{padding:12px 22px 18px}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted);font-size:15px}
.lines b{color:var(--text);font-variant-numeric:tabular-nums;text-align:right}
.pl{padding:20px 22px 12px;display:flex;flex-direction:column}
.plhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pllabel{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent}
.tri.up{border-bottom:9px solid var(--green)}.tri.down{border-top:9px solid var(--red)}
.per{display:flex;gap:2px}
.per button{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer}
.per button.on{background:rgba(59,130,246,.16);color:#7fb0ff}
.plbig{font-size:42px;font-weight:800;letter-spacing:-.03em;margin:8px 0 0;font-variant-numeric:tabular-nums}
.plsub{color:var(--muted);font-size:15px}
.chart{position:relative;margin-top:10px;flex:1;min-height:150px}
.chart svg{display:block;width:100%;height:170px;overflow:visible}
.chart text{fill:var(--dim);font:500 11px var(--mono)}
.tip{position:absolute;top:0;pointer-events:none;background:#0b0f1a;border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font:600 12px/1.45 var(--mono);white-space:nowrap;opacity:0;transition:opacity .12s}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* positions */
.ptabs{display:flex;gap:22px;margin:36px 0 16px}
.ptab{background:none;border:0;color:var(--muted);font-weight:700;font-size:21px;padding:0;cursor:pointer}
.ptab.on{color:var(--text)}
.ctrl{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;padding:4px}
.seg button{background:none;border:0;color:var(--muted);font-weight:600;font-size:15px;padding:7px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.08);color:var(--text)}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;color:var(--dim)}
.search input{flex:1;background:none;border:0;color:var(--text);font:16px Inter,sans-serif;outline:none;padding:11px 0}
.thead,.rowi{display:grid;align-items:center;gap:12px;padding:0 18px}
.thead{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-top:14px;padding-bottom:12px}
.rowi{background:var(--row);border-radius:14px;padding-top:14px;padding-bottom:14px;margin-bottom:8px;transition:background .2s;animation:rowin .4s var(--ease) backwards}
.rowi:hover{background:#18203a}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}}
.g-active{grid-template-columns:minmax(0,1fr) 80px 80px 150px}
.g-closed{grid-template-columns:90px minmax(0,1fr) 130px 160px}
.g-act{grid-template-columns:96px minmax(0,1fr) 120px 130px}
.r{text-align:right}
.mk{display:flex;gap:14px;align-items:center;min-width:0}
.ic{width:46px;height:46px;border-radius:10px;flex:none;display:grid;place-items:center;font:800 15px/1 var(--mono);color:#0b0f1a}
.mt{min-width:0}
.mt .t{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.mt .s{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:14px}
.chip{font-weight:600;font-size:13px;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--text)}
.chip.yes{background:rgba(34,197,94,.16);color:#4ade80}.chip.no{background:rgba(248,113,113,.16);color:#fca5a5}
.num2{font-variant-numeric:tabular-nums;font-size:16px}
.val b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.val small{font-size:14px;font-variant-numeric:tabular-nums}
.won{color:var(--green);font-weight:600}
.lost{color:var(--red);font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--row);border-radius:14px}
.ty{font-weight:600}
footer{color:var(--dim);font-size:13px;margin-top:40px;line-height:1.6}

@media(max-width:820px){
  .top{grid-template-columns:1fr}
  .hw{flex-wrap:wrap}.brand{font-size:17px}.tabs{order:3;width:100%}.tab{flex:1}.dd{margin-left:auto}
  .menu{width:min(340px,calc(100vw - 32px))}
  .plbig{font-size:36px}
  .g-active{grid-template-columns:minmax(0,1fr) 110px}.g-active .hm{display:none}
  .g-closed{grid-template-columns:minmax(0,1fr) 120px}.g-closed .hm{display:none}
  .g-act{grid-template-columns:minmax(0,1fr) 110px}.g-act .hm{display:none}
  .rowi,.thead{padding-left:12px;padding-right:12px}
  .ic{width:38px;height:38px}
}
@media(max-width:480px){.ddbtn #ddname{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prof h1{font-size:22px}.av{width:58px;height:58px;font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}
</style>
</head><body>
<div class="bgfx"><div class="glow a"></div><div class="glow b"></div></div>

<header><div class="hw">
  <div class="brand"><svg width="24" height="20" viewBox="0 0 26 22" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><path d="M2 2l9 9-9 9M13 2l9 9-9 9" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Strategy <b>Race</b></div>
  <nav class="tabs"><button class="tab" data-p="polymarket">Polymarket</button><button class="tab" data-p="kalshi">Kalshi</button></nav>
  <div class="dd" id="dd">
    <button class="ddbtn" id="ddbtn" aria-haspopup="true" aria-expanded="false"><span class="num" id="ddnum">–</span><span id="ddname">Loading…</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="menu" id="menu" role="menu"></div>
  </div>
</div></header>

<main>
  <div id="view"></div>
  <footer>Paper money only. No real orders are ever sent. Every strategy started with $1,000 on Oct 19, 2026. Updates every couple of minutes from Polymarket US, Kalshi and Pinnacle. <span id="fresh"></span></footer>
</main>

<script>
const GIST = "b578344323fb45f92678c21a23051655";
const PALETTE = ["#22d3ee", "#a78bfa", "#f59e0b", "#f472b6", "#34d399", "#60a5fa", "#fb7185", "#facc15", "#2dd4bf", "#c084fc", "#3b82f6", "#22c55e", "#fb923c", "#38bdf8", "#e879f9", "#a3e635"];
const COLORS = new Proxy({}, {get: (_, id) => { const i = D ? D.strategies.findIndex(s => s.id === id) : 0; return PALETTE[Math.max(0, i) % PALETTE.length]; }});
const PLAT = {polymarket: "Polymarket US", kalshi: "Kalshi"};
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let D = null, sel = null, period = 0, ptab = "positions", pseg = "active", q = "", prevBig = {};

const fmt2 = v => Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money = v => { v = Math.round(v * 100) / 100; return (v < 0 ? "-" : "") + "$" + fmt2(v); };
const signed = v => { v = Math.round(v * 100) / 100; return (v > 0 ? "+" : v < 0 ? "-" : "") + "$" + fmt2(v); };
const cls = v => v > 0.004 ? "pos" : v < -0.004 ? "neg" : "";
const c1 = v => { const x = v * 100; return (x >= 10 || Math.abs(x - Math.round(x)) < .05 ? Math.round(x) : x.toFixed(1)) + "¢"; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const when = iso => new Date(iso).toLocaleString("en-US", {timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : Math.floor(s / 86400) + "d ago"; };
const initials = t => (String(t).replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(w => !/^(will|the|win|of|vs|to|a|an|does|not|wins)$/i.test(w)).slice(0, 2).map(w => w[0]).join("") || "•").toUpperCase();
const strat = id => D.strategies.find(s => s.id === id);

async function load() {
  try {
    let txt;
    const r = await fetch("https://api.github.com/gists/" + GIST, {cache: "no-store"});
    if (r.ok) { const f = (await r.json()).files["data.json"]; txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content; }
    else txt = await (await fetch(`https://gist.githubusercontent.com/capi789/${GIST}/raw/data.json?t=${Date.now()}`)).text();
    const first = !D; const next = JSON.parse(txt);
    if (!next.strategies) return;
    D = next;
    if (first) { let want = (location.hash || "").slice(1); if (!strat(want)) { try { want = localStorage.getItem("race-strat"); } catch (e) {} } sel = strat(want) ? want : "mm"; }
    renderMenu(); render(first);
    $("fresh").textContent = "Last update " + ago(D.published_at) + ".";
  } catch (e) { $("fresh").textContent = "Couldn't reach the data, retrying."; }
}

/* ---------- header: tabs + strategy dropdown ---------- */
function renderMenu() {
  const s = strat(sel);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.p === s.platform));
  $("ddnum").textContent = s.num; $("ddnum").style.background = COLORS[s.id];
  $("ddname").textContent = `Strategy ${s.num} · ${s.name}`;
  const group = p => `<div class="mgroup">${PLAT[p]}</div>` + D.strategies.filter(x => x.platform === p).sort((a, b) => a.num - b.num).map(x =>
    `<button class="mi ${x.id === sel ? "on" : ""}" role="menuitem" data-id="${x.id}"><span class="num" style="background:${COLORS[x.id]}">${x.num}</span><span><div class="nm">Strategy ${x.num} · ${esc(x.name)}</div><div class="by">${esc(x.by)}</div></span><span class="rs"><span>${money(1000 + x.pnl)}</span><small class="${cls(x.pnl)}">${signed(x.pnl)}</small></span></button>`).join("");
  $("menu").innerHTML = group("polymarket") + group("kalshi");
  $("menu").querySelectorAll(".mi").forEach(b => b.onclick = () => { pick(b.dataset.id); closeMenu(); });
}
function pick(id) {
  sel = id; history.replaceState(null, "", "#" + id);
  try { localStorage.setItem("race-strat", id); } catch (e) {}
  q = ""; renderMenu(); render(true);
}
const closeMenu = () => { $("dd").classList.remove("open"); $("ddbtn").setAttribute("aria-expanded", "false"); };
$("ddbtn").onclick = e => { e.stopPropagation(); const o = $("dd").classList.toggle("open"); $("ddbtn").setAttribute("aria-expanded", o); };
document.addEventListener("click", e => { if (!$("dd").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  if (!D) return;
  if (strat(sel).platform === t.dataset.p) return;
  const s = D.strategies.filter(x => x.platform === t.dataset.p).sort((a, b) => a.num - b.num)[0]; if (s) pick(s.id);
});

/* ---------- main view ---------- */
function render(animate) {
  const s = strat(sel), col = COLORS[s.id];
  const v = $("view");
  v.innerHTML = `
  <div class="top">
    <section class="box prof">
      <div class="head"><div class="av" style="background:linear-gradient(135deg,${col},#0b0f1a 140%)">${s.num}</div>
        <div><h1>Strategy ${s.num} · ${esc(s.name)}</h1><div class="meta">${esc(s.by)} · ${PLAT[s.platform]} · started ${new Date(s.started).toLocaleDateString("en-US", {month: "short", day: "numeric"})}</div></div></div>
      <div class="how">${esc(s.how)}</div>
      <div class="trio"><div><b>${money(s.positions_value)}</b><span>Positions value</span></div><div><b>${money(s.biggest_win)}</b><span>Biggest win</span></div><div><b>${s.markets}</b><span>Markets traded</span></div></div>
      <div class="lines"><div>Total P&amp;L<b class="${cls(s.pnl)}">${signed(s.pnl)}</b></div><div>Started with → now<b>$1,000.00 → ${money(s.value)}</b></div>${s.pnl10 != null ? `<div>At $10 per parlay instead<b class="${cls(s.pnl10)}">${signed(s.pnl10)}</b></div>` : ""}<div>Record<b>${s.wins} won · ${s.losses} lost · ${s.active.length} open</b></div><div>Total volume<b>${money(s.volume)}</b></div></div>
    </section>
    <section class="box pl">
      <div class="plhead"><div class="pllabel"><span class="tri" id="tri"></span>Profit/Loss</div>
        <div class="per">${[["1D", 1], ["1W", 7], ["1M", 30], ["ALL", 0]].map(([l, d]) => `<button data-d="${d}" class="${d === period ? "on" : ""}">${l}</button>`).join("")}</div></div>
      <div class="plbig" id="plbig">–</div><div class="plsub" id="plsub"></div>
      <div class="chart"><svg id="chart" role="img" aria-label="Profit over time"></svg><div class="tip" id="tip"></div></div>
    </section>
  </div>
  <div class="ptabs"><button class="ptab ${ptab === "positions" ? "on" : ""}" data-t="positions">Positions</button><button class="ptab ${ptab === "activity" ? "on" : ""}" data-t="activity">Activity</button></div>
  <div id="list"></div>`;
  if (animate) { v.classList.remove("swap"); void v.offsetWidth; v.classList.add("swap"); }
  v.querySelectorAll(".per button").forEach(b => b.onclick = () => { period = +b.dataset.d; v.querySelectorAll(".per button").forEach(x => x.classList.toggle("on", x === b)); pl(s, true); });
  v.querySelectorAll(".ptab").forEach(b => b.onclick = () => { ptab = b.dataset.t; v.querySelectorAll(".ptab").forEach(x => x.classList.toggle("on", x === b)); list(s, true); });
  pl(s, animate); list(s, animate);
}

function periodStart() {
  if (!period) return 0;
  if (period === 1) return new Date(new Date().toLocaleDateString("en-US", {timeZone: "America/New_York"}) + " 00:00 EDT").getTime();
  return Date.now() - period * 864e5;
}
function pl(s, animate) {
  const t0 = periodStart();
  let pts = s.equity.map(p => [new Date(p[0]).getTime(), p[1]]);
  const before = [...pts].reverse().find(p => p[0] < t0);
  const base = period && before ? before[1] : 0;
  const chg = s.pnl - base;
  const big = $("plbig"); big.className = "plbig " + cls(chg);
  countTo(big, chg, sel + period, animate);
  $("tri").className = "tri " + (chg >= 0 ? "up" : "down");
  $("plsub").textContent = {1: "Past day", 7: "Past week", 30: "Past month", 0: "All time"}[period];
  if (period) pts = pts.filter(p => p[0] >= t0);
  pts.push([Date.now(), s.pnl]);
  pts = pts.map(p => [p[0], p[1] - base]);
  drawChart(pts, chg >= 0 ? "#22c55e" : "#f87171", animate);
}
function countTo(el, v, key, animate) {
  const from = animate ? 0 : (prevBig[key] ?? v); prevBig[key] = v;
  if (reduce || Math.abs(v - from) < .005) { el.textContent = signed(v); return; }
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = signed(from + (v - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function drawChart(pts, color, animate) {
  const svg = $("chart"), W = svg.clientWidth || 480, H = 170, pad = {l: 4, r: 4, t: 10, b: 20};
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle">Chart fills in as trades come in</text>`; return; }
  const x0 = pts[0][0], x1 = pts[pts.length - 1][0];
  let y0 = Math.min(0, ...pts.map(p => p[1])), y1 = Math.max(0, ...pts.map(p => p[1])); if (y1 - y0 < 2) { y1 += 1; y0 -= 1; }
  const X = t => pad.l + (t - x0) / (x1 - x0 || 1) * (W - pad.l - pad.r), Y = v => pad.t + (y1 - v) / (y1 - y0) * (H - pad.t - pad.b);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  const fmt = t => new Date(t).toLocaleString("en-US", (x1 - x0) > 2 * 864e5 ? {timeZone: "America/New_York", month: "short", day: "numeric"} : {timeZone: "America/New_York", hour: "numeric", minute: "2-digit"});
  svg.innerHTML = `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 4"/>
    <path d="${d}L${X(x1)},${H - pad.b}L${X(x0)},${H - pad.b}Z" fill="url(#fill)"/>
    <path id="ln" d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${pad.l}" y="${H - 4}">${fmt(x0)}</text><text x="${W - pad.r}" y="${H - 4}" text-anchor="end">${fmt(x1)}</text>
    <line id="cx" y1="${pad.t}" y2="${H - pad.b}" stroke="rgba(255,255,255,.25)" visibility="hidden"/><circle id="cd" r="5" fill="${color}" stroke="#131a2c" stroke-width="2" visibility="hidden"/>`;
  if (animate && !reduce) { const ln = svg.querySelector("#ln"); ln.style.setProperty("--len", ln.getTotalLength()); ln.classList.add("draw"); }
  const tip = $("tip");
  svg.onmousemove = ev => {
    const mx = ev.clientX - svg.getBoundingClientRect().left;
    let b = 0; pts.forEach((p, i) => { if (Math.abs(X(p[0]) - mx) < Math.abs(X(pts[b][0]) - mx)) b = i; });
    const p = pts[b], x = X(p[0]);
    svg.querySelector("#cx").setAttribute("x1", x); svg.querySelector("#cx").setAttribute("x2", x); svg.querySelector("#cx").setAttribute("visibility", "visible");
    const c = svg.querySelector("#cd"); c.setAttribute("cx", x); c.setAttribute("cy", Y(p[1])); c.setAttribute("visibility", "visible");
    tip.innerHTML = `<span class="${cls(p[1])}">${signed(p[1])}</span> <span style="color:var(--dim)">${when(new Date(p[0]).toISOString())}</span>`;
    tip.style.opacity = 1; tip.style.left = Math.max(0, Math.min(x - 70, W - 190)) + "px";
  };
  svg.onmouseleave = () => { tip.style.opacity = 0; svg.querySelectorAll("#cx,#cd").forEach(n => n.setAttribute("visibility", "hidden")); };
}

/* ---------- positions / activity ---------- */
function icon(s, title) { return `<div class="ic" style="background:linear-gradient(135deg,${COLORS[s.id]},#e6ecff 160%)">${esc(initials(title))}</div>`; }
function chip(label, price) {
  const k = /^(yes|over)/i.test(label) ? "yes" : /^(no|under)/i.test(label) ? "no" : "";
  return label ? `<span class="chip ${k}">${esc(label)}${price != null ? " " + c1(price) : ""}</span>` : (price != null ? `<span class="chip">${c1(price)}</span>` : "");
}
function list(s, animate) {
  const L = $("list");
  const match = x => !q || (x.market + " " + (x.sub || "")).toLowerCase().includes(q.toLowerCase());
  const d = i => animate ? `style="animation-delay:${Math.min(i, 12) * 30}ms"` : `style="animation:none"`;
  const controls = ptab === "positions"
    ? `<div class="ctrl"><div class="seg"><button data-s="active" class="${pseg === "active" ? "on" : ""}">Active</button><button data-s="closed" class="${pseg === "closed" ? "on" : ""}">Closed</button></div><label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" placeholder="Search positions" value="${esc(q)}"></label></div>`
    : "";
  let body = "";
  if (ptab === "positions" && pseg === "active") {
    const rows = s.active.filter(match).sort((a, b) => b.value - a.value);
    body = rows.length ? `<div class="thead g-active"><span>Market</span><span class="r hm">Avg</span><span class="r hm">Current</span><span class="r">Value</span></div>` + rows.map((x, i) => `
      <div class="rowi g-active" ${d(i)}><div class="mk">${icon(s, x.market)}<div class="mt"><div class="t">${esc(x.market)}</div><div class="s">${chip(x.label, x.avg)}<span>${x.shares.toLocaleString()} shares</span>${x.sub ? `<span>· ${esc(x.sub)}</span>` : ""}</div></div></div>
      <div class="r num2 hm">${c1(x.avg)}</div><div class="r num2 hm">${c1(x.cur)}</div>
      <div class="r val"><b>${money(x.value)}</b><small class="${cls(x.pnl)}">${signed(x.pnl)} (${x.pct > 0 ? "+" : ""}${x.pct}%)</small></div></div>`).join("")
      : `<div class="empty">${s.active.length ? "No matches." : emptyText(s)}</div>`;
  } else if (ptab === "positions") {
    const rows = s.closed.filter(match);
    body = rows.length ? `<div class="thead g-closed"><span class="hm">Result</span><span>Market</span><span class="r hm">Total traded</span><span class="r">Amount won</span></div>` + rows.map((x, i) => `
      <div class="rowi g-closed" ${d(i)}><div class="hm ${x.pnl > 0 ? "won" : "lost"}">${x.pnl > 0 ? "✓ Won" : "✕ Lost"}</div>
      <div class="mk">${icon(s, x.market)}<div class="mt"><div class="t">${esc(x.market)}</div><div class="s">${chip(x.label)}${x.sub ? `<span>${esc(x.sub)}</span>` : ""}<span>· ${when(x.at)}</span></div></div></div>
      <div class="r num2 hm">${money(x.traded)}</div><div class="r val"><b>${money(x.returned)}</b><small class="${cls(x.pnl)}">${signed(x.pnl)} (${x.pct > 0 ? "+" : ""}${x.pct}%)</small></div></div>`).join("")
      : `<div class="empty">${s.closed.length ? "No matches." : "Nothing has settled yet. Closed trades show here with what they won or lost."}</div>`;
  } else {
    const rows = s.activity;
    body = rows.length ? `<div class="thead g-act"><span class="hm">Type</span><span>Market</span><span class="r hm">Price</span><span class="r">Amount</span></div>` + rows.map((x, i) => `
      <div class="rowi g-act" ${d(i)}><div class="ty hm ${/Won/.test(x.type) ? "pos" : /Lost/.test(x.type) ? "neg" : ""}">${esc(x.type)}</div>
      <div class="mk">${icon(s, x.market)}<div class="mt"><div class="t">${esc(x.market)}</div><div class="s"><span>${x.shares.toLocaleString()} shares</span>${x.sub ? `<span>· ${esc(x.sub)}</span>` : ""}<span>· ${ago(x.at)}</span></div></div></div>
      <div class="r num2 hm">${c1(x.price)}</div><div class="r num2"><b>${money(x.usd)}</b></div></div>`).join("")
      : `<div class="empty">${emptyText(s)}</div>`;
  }
  L.innerHTML = controls + body;
  L.querySelectorAll(".seg button").forEach(b => b.onclick = () => { pseg = b.dataset.s; list(s, true); });
  const qi = $("q"); if (qi) qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; list(s, false); const n = $("q"); n.focus(); n.setSelectionRange(pos, pos); };
}
function emptyText(s) { return s.empty || "No trades yet."; }

addEventListener("resize", () => { if (D) pl(strat(sel), false); });
setInterval(load, 60000);
setInterval(() => { if (D) $("fresh").textContent = "Last update " + ago(D.published_at) + "."; }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
